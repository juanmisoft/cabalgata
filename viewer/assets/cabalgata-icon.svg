<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cabalgata de Reyes lanzando caramelos">
  <style>
    .glow { animation: pulse 2.4s ease-in-out infinite; }
    .arm-c { transform-origin: 72px 70px; animation: toss-c 1.1s ease-in-out infinite; }
    .arm-l { transform-origin: 29px 72px; animation: toss-l 1.25s ease-in-out infinite; }
    .arm-r { transform-origin: 99px 72px; animation: toss-r 1.15s ease-in-out infinite 0.2s; }
    .candy1 { animation: candy-l 1.25s linear infinite; }
    .candy2 { animation: candy-c 1.1s linear infinite; }
    .candy3 { animation: candy-c2 1.1s linear infinite 0.15s; }
    .candy4 { animation: candy-r 1.15s linear infinite 0.35s; }
    .candy5 { animation: candy-r2 1.15s linear infinite 0.5s; }
    .spark1 { animation: spark 1.8s ease-in-out infinite; }
    .spark2 { animation: spark 1.6s ease-in-out infinite reverse; }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes toss-c {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-28deg); }
    }
    @keyframes toss-l {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(32deg); }
    }
    @keyframes toss-r {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-34deg); }
    }
    @keyframes candy-l {
      0% { transform: translate(10px, 10px); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translate(-26px, -36px); opacity: 0; }
    }
    @keyframes candy-c {
      0% { transform: translate(8px, 20px); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translate(-10px, -36px); opacity: 0; }
    }
    @keyframes candy-c2 {
      0% { transform: translate(12px, 20px); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translate(-8px, -36px); opacity: 0; }
    }
    @keyframes candy-r {
      0% { transform: translate(-8px, 14px); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translate(14px, -34px); opacity: 0; }
    }
    @keyframes candy-r2 {
      0% { transform: translate(-6px, 14px); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translate(16px, -34px); opacity: 0; }
    }
    @keyframes spark {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Fondo transparente a propósito: sin rect de fondo -->

  <circle class="glow" cx="64" cy="68" r="50" fill="#ffb347" fill-opacity="0.28"/>

  <ellipse cx="64" cy="108" rx="42" ry="7" fill="#1a1a1a" opacity="0.18"/>
  <rect x="22" y="86" width="84" height="18" rx="6" fill="#c20000"/>
  <rect x="28" y="80" width="72" height="10" rx="4" fill="#8a0000"/>
  <circle cx="38" cy="106" r="7" fill="#2b2b2b"/>
  <circle cx="38" cy="106" r="3" fill="#c9c9c9"/>
  <circle cx="90" cy="106" r="7" fill="#2b2b2b"/>
  <circle cx="90" cy="106" r="3" fill="#c9c9c9"/>
  <path d="M34 80 Q64 68 94 80" fill="#ffd56a"/>

  <!-- Melchor -->
  <g transform="translate(64 58)">
    <ellipse cx="0" cy="18" rx="11" ry="14" fill="#f3d9a4"/>
    <path d="M-10 10 Q0 24 10 10 L8 22 Q0 28 -8 22 Z" fill="#f5f0e6"/>
    <circle cx="0" cy="2" r="9" fill="#f3d9a4"/>
    <path d="M-8 -4 Q0 -14 8 -4 L6 2 Q0 6 -6 2 Z" fill="#d4a017"/>
    <circle cx="-3.5" cy="0" r="1.1" fill="#2b2b2b"/>
    <circle cx="3.5" cy="0" r="1.1" fill="#2b2b2b"/>
    <path d="M-2 4 Q0 6 2 4" fill="none" stroke="#8a4b2b" stroke-width="1" stroke-linecap="round"/>
  </g>
  <path class="arm-c" d="M72 70 L82 60" stroke="#f3d9a4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Gaspar -->
  <g transform="translate(38 62)">
    <ellipse cx="0" cy="16" rx="10" ry="13" fill="#e8c49a"/>
    <path d="M-9 8 Q0 20 9 8 L7 20 Q0 25 -7 20 Z" fill="#c45c26"/>
    <circle cx="0" cy="1" r="8.2" fill="#e8c49a"/>
    <path d="M-7 -4 Q0 -12 7 -4 L5 1 Q0 4 -5 1 Z" fill="#1f7a4d"/>
    <rect x="-5" y="-8" width="10" height="3" rx="1" fill="#ffd56a"/>
    <circle cx="-3" cy="-0.5" r="1" fill="#2b2b2b"/>
    <circle cx="3" cy="-0.5" r="1" fill="#2b2b2b"/>
    <path d="M-6 5 Q0 10 6 5 Q0 12 -6 5 Z" fill="#6b3a22"/>
  </g>
  <path class="arm-l" d="M29 72 L18 62" stroke="#e8c49a" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Baltasar -->
  <g transform="translate(90 62)">
    <ellipse cx="0" cy="16" rx="10" ry="13" fill="#8d5a3c"/>
    <path d="M-9 8 Q0 20 9 8 L7 20 Q0 25 -7 20 Z" fill="#4b2a78"/>
    <circle cx="0" cy="1" r="8.2" fill="#8d5a3c"/>
    <path d="M-7 -4 Q0 -13 7 -4 L5 1 Q0 5 -5 1 Z" fill="#ffd56a"/>
    <circle cx="0" cy="-10" r="2.2" fill="#e8c49a"/>
    <circle cx="-3" cy="-0.5" r="1" fill="#1a1a1a"/>
    <circle cx="3" cy="-0.5" r="1" fill="#1a1a1a"/>
    <path d="M-5 5 Q0 9 5 5 Q0 11 -5 5 Z" fill="#3a2318"/>
  </g>
  <path class="arm-r" d="M99 72 L110 63" stroke="#8d5a3c" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Caramelos -->
  <g class="candy1" transform="translate(24 48)">
    <ellipse cx="0" cy="0" rx="4" ry="2.6" fill="#ff5a7a" transform="rotate(-20)"/>
    <rect x="-6" y="-2" width="3" height="4" rx="1" fill="#ffe08a"/>
  </g>
  <g class="candy2" transform="translate(64 28)">
    <ellipse cx="0" cy="0" rx="3.8" ry="2.5" fill="#5ec8ff" transform="rotate(12)"/>
  </g>
  <circle class="candy3" cx="68" cy="30" r="2.2" fill="#ffd56a"/>
  <g class="candy4" transform="translate(104 44)">
    <ellipse cx="0" cy="0" rx="4" ry="2.6" fill="#9be15d" transform="rotate(18)"/>
  </g>
  <rect class="candy5" x="108" y="42" width="3.2" height="4.2" rx="1" fill="#ff7a59"/>

  <path class="spark1" d="M18 30 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5 z" fill="#ffe9a8"/>
  <path class="spark2" d="M110 26 l1.2 2.8 2.8 1.2 -2.8 1.2 -1.2 2.8 -1.2 -2.8 -2.8 -1.2 2.8 -1.2 z" fill="#ffe9a8"/>
</svg>
