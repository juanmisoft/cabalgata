<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c20000" />
  <meta name="description" content="Sigue en directo el recorrido de la Cabalgata de Reyes de Rivas Vaciamadrid." />
  <title>Cabalgata de Reyes · Rivas Vaciamadrid</title>
  <link rel="icon" href="assets/cabalgata-icon.svg?v=7" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Source+Sans+3:wght@400;600;650;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css" />
  <link rel="stylesheet" href="css/styles.css?v=20" />
  <script>
    var dojoConfig = { async: true };
  </script>
  <script src="js/config.js?v=22"></script>
  <script src="js/geometry.js"></script>
  <script src="js/presence.js"></script>
  <script src="https://js.arcgis.com/4.31/"></script>
  <script src="js/app.js?v=22"></script>
</head>
<body>
  <div id="viewDiv" role="application" aria-label="Mapa del recorrido de la cabalgata"></div>

  <header class="top-bar">
    <div class="brand-chip">
      <div class="brand-left">
        <img
          class="ayto-logo"
          src="assets/logo_rivas.png"
          width="120"
          height="48"
          alt="Ayuntamiento de Rivas Vaciamadrid"
          decoding="async"
        />
        <span
          id="brandIcon"
          class="brand-icon"
          role="img"
          aria-label="Los Tres Reyes Magos en la carroza lanzando caramelos"
        ></span>
      </div>
      <div class="brand-text">
        <h1>Cabalgata de Reyes 2027</h1>
        <p>seguimiento en tiempo real</p>
      </div>
      <div id="statusChip" class="status-chip header-status" data-state="pending">Cargando…</div>
    </div>
    <div class="status-row">
      <div id="viewersChip" class="status-chip viewers-chip is-hidden" title="Personas con el visor abierto ahora">
        <span class="viewers-label">Viendo ahora</span>
        <span id="viewersCount" class="viewers-count">—</span>
      </div>
    </div>
  </header>

  <aside id="liveVideo" class="live-video is-hidden" aria-label="Video en directo">
    <button
      id="liveVideoToggle"
      class="live-video-bar"
      type="button"
      aria-expanded="false"
      title="Ampliar o reducir el video"
    >
      <span class="live-video-dot" aria-hidden="true"></span>
      <span class="live-video-title">Video en directo</span>
      <span id="liveVideoHint" class="live-video-hint">Toca para ampliar</span>
    </button>
    <div class="live-video-frame">
      <iframe
        id="liveVideoFrame"
        title="Cabalgata de Reyes en directo"
        src=""
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
      <button
        id="liveVideoHit"
        class="live-video-hit"
        type="button"
        aria-label="Ampliar video a todo el ancho"
      ></button>
    </div>
  </aside>

  <aside class="bottom-panel" aria-live="polite">
    <div class="info-chip street">
      <span id="streetLabel" class="label">Ahora está en</span>
      <span id="streetValue" class="value">Localizando…</span>
    </div>
    <div id="etaChip" class="info-chip eta is-hidden">
      <span class="label">Tu zona</span>
      <span id="etaValue" class="value">Activa tu ubicación</span>
    </div>
    <div class="actions">
      <button id="btnLocate" class="btn-primary" type="button">Activar mi ubicación</button>
      <button id="btnFollow" class="btn-secondary is-active" type="button" aria-pressed="true">Desactivar seguimiento</button>
    </div>
  </aside>

  <script>
    (function () {
      var cfg = window.CABALGATA_CONFIG && window.CABALGATA_CONFIG.youtube;
      var root = document.getElementById("liveVideo");
      var frame = document.getElementById("liveVideoFrame");
      var toggle = document.getElementById("liveVideoToggle");
      var hit = document.getElementById("liveVideoHit");
      var hint = document.getElementById("liveVideoHint");
      if (!cfg || !cfg.enabled || !cfg.videoId || !root || !frame) return;

      // autoplay exige mute en la mayoría de navegadores
      frame.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(cfg.videoId) +
        "?autoplay=1&mute=1&playsinline=1&rel=0";
      root.classList.remove("is-hidden");

      function setExpanded(on) {
        root.classList.toggle("is-expanded", on);
        if (toggle) toggle.setAttribute("aria-expanded", on ? "true" : "false");
        if (hint) hint.textContent = on ? "Toca para reducir" : "Toca para ampliar";
        if (hit) hit.hidden = on;
      }

      function toggleExpanded() {
        setExpanded(!root.classList.contains("is-expanded"));
      }

      if (toggle) toggle.addEventListener("click", toggleExpanded);
      if (hit) hit.addEventListener("click", function () { setExpanded(true); });
    })();
  </script>
</body>
</html>
