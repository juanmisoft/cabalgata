<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <style>
    .shadow { animation: squash 0.7s ease-in-out infinite; transform-origin: 48px 88px; }
    .jumper { animation: jump 0.7s ease-in-out infinite; transform-origin: 48px 88px; }
    .arm-l { animation: arm-l 0.7s ease-in-out infinite; transform-origin: 34px 48px; }
    .arm-r { animation: arm-r 0.7s ease-in-out infinite; transform-origin: 62px 48px; }
    .leg-l { animation: leg-l 0.7s ease-in-out infinite; transform-origin: 40px 58px; }
    .leg-r { animation: leg-r 0.7s ease-in-out infinite; transform-origin: 56px 58px; }
    .spark { animation: spark 0.7s ease-in-out infinite; }
    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      45% { transform: translateY(-14px); }
      55% { transform: translateY(-14px); }
    }
    @keyframes squash {
      0%, 100% { transform: scaleX(1); opacity: 0.22; }
      45%, 55% { transform: scaleX(0.55); opacity: 0.1; }
    }
    @keyframes arm-l {
      0%, 100% { transform: rotate(0deg); }
      45%, 55% { transform: rotate(-18deg); }
    }
    @keyframes arm-r {
      0%, 100% { transform: rotate(0deg); }
      45%, 55% { transform: rotate(18deg); }
    }
    @keyframes leg-l {
      0%, 100% { transform: rotate(8deg); }
      45%, 55% { transform: rotate(-12deg); }
    }
    @keyframes leg-r {
      0%, 100% { transform: rotate(-8deg); }
      45%, 55% { transform: rotate(12deg); }
    }
    @keyframes spark {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
  </style>
  <ellipse class="shadow" cx="48" cy="88" rx="16" ry="4" fill="#1a1a1a"/>
  <g class="jumper">
    <g class="leg-l">
      <path d="M40 58 L34 78 L40 76 Z" fill="#2b6cb0"/>
      <circle cx="34" cy="80" r="4" fill="#f0c27a"/>
    </g>
    <g class="leg-r">
      <path d="M56 58 L62 78 L56 76 Z" fill="#2b6cb0"/>
      <circle cx="62" cy="80" r="4" fill="#f0c27a"/>
    </g>
    <ellipse cx="48" cy="52" rx="14" ry="16" fill="#e11d48"/>
    <g class="arm-l">
      <path d="M34 48 L18 28" stroke="#f0c27a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g class="arm-r">
      <path d="M62 48 L78 28" stroke="#f0c27a" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="48" cy="28" r="14" fill="#f0c27a"/>
    <path d="M36 22 Q48 8 60 22 Q54 16 48 18 Q42 16 36 22 Z" fill="#5b3a1a"/>
    <circle cx="43" cy="27" r="2" fill="#1a1a1a"/>
    <circle cx="53" cy="27" r="2" fill="#1a1a1a"/>
    <path d="M42 34 Q48 40 54 34" fill="none" stroke="#c45c26" stroke-width="2" stroke-linecap="round"/>
    <circle class="spark" cx="22" cy="18" r="2.5" fill="#ffd56a"/>
    <circle class="spark" cx="74" cy="16" r="2" fill="#ffd56a"/>
    <path class="spark" d="M48 6 l1.2 2.8 2.8 1.2 -2.8 1.2 -1.2 2.8 -1.2 -2.8 -2.8 -1.2 2.8 -1.2 z" fill="#ffe08a"/>
  </g>
</svg>
